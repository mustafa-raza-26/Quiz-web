<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | QuizFlow Intelligence</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#060e20",

                        "surface-container": "#171f33",
                        "outline-variant": "#464554",
                        "inverse-primary": "#494bd6",
                        "tertiary": "#ffb0cd",

                        "on-tertiary-fixed-variant": "#8c0053",

                        "secondary-container": "#6f00be",
                        "on-primary-container": "#0d0096",
                        "surface-dim": "#0b1326",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#570032",
                        "on-surface": "#dae2fd",
                        "inverse-on-surface": "#283044",
                        "on-secondary-fixed-variant": "#6900b3",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-tertiary": "#640039",
                        "surface-bright": "#31394d",
                        "surface": "#0b1326",
                        "surface-tint": "#c0c1ff",
                        "outline": "#908fa0",
                        "on-secondary": "#490080",
                        "tertiary-fixed-dim": "#ffb0cd",
                        "on-tertiary-fixed": "#3e0022",
                        "surface-variant": "#2d3449",

                        "tertiary-fixed": "#ffd9e4",
                        "surface-container-highest": "#2d3449",
                        "secondary-fixed": "#f0dbff",
                        "on-surface-variant": "#c7c4d7",

                    "borderRadius": {

    <style>
        .glass-card {
            background: rgba(23, 31, 51, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(192, 193, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(99, 102, 241, 0.15);
        }

        .inner-glow {
            box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.05);
        }

        .gradient-btn {
            background: linear-gradient(135deg, #8083ff 0%, #6f00be 100%);
            transition: all 0.2s ease-out;
        }

        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(111, 0, 190, 0.4);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(192, 193, 255, 0.2);
        }

        .bg-animate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
</head>

<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col">
    <!-- Atmospheric Shader Background -->

    <!-- Top Navigation (Shell suppressed for Transactional screen per guidelines, but using brand anchor logic for logo) -->
    <header class="fixed top-0 w-full z-50 flex justify-center py-stack-md px-gutter">
        <div class="flex items-center gap-2 group cursor-pointer transition-transform duration-300 hover:scale-105">
            <span class="material-symbols-outlined text-primary text-3xl"
                style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
            <span class="font-display-lg text-headline-md font-extrabold text-primary tracking-tight">QuizFlow</span>
        </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="flex-grow flex items-center justify-center px-margin-mobile py-stack-lg mt-16 md:mt-0">
        <div
            class="w-full max-w-[480px] glass-card rounded-[32px] p-stack-md md:p-stack-lg inner-glow relative overflow-hidden">
            <!-- Background Decorative Blur -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 blur-[80px] rounded-full"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-secondary/10 blur-[80px] rounded-full"></div>
            <div class="relative z-10">
                <header class="text-center mb-stack-lg">
                    <h1 class="font-display-lg text-headline-md text-on-surface mb-2">Welcome Back</h1>
                    <p class="font-body-sm text-on-surface-variant">Continue your journey to knowledge mastery.</p>
                </header>
                <!-- Social Logins -->
                <div class="grid grid-cols-2 gap-stack-sm mb-stack-lg">
                    <button
                        class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 group">
                        <svg class="w-5 h-5" viewbox="0 0 24 24">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                fill="currentColor"></path>
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="currentColor"></path>
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                                fill="currentColor"></path>
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="currentColor"></path>
                        </svg>
                        <span
                            class="font-label-caps uppercase text-[10px] tracking-widest text-on-surface-variant group-hover:text-on-surface">Google</span>
                    </button>
                    <button
                        class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200 group">
                        <svg class="w-5 h-5" viewbox="0 0 24 24">
                            <path
                                d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
                                fill="currentColor"></path>
                        </svg>
                        <span
                            class="font-label-caps uppercase text-[10px] tracking-widest text-on-surface-variant group-hover:text-on-surface">GitHub</span>
                    </button>
                </div>
                <div class="flex items-center gap-4 mb-stack-lg">
                    <div class="h-[1px] flex-grow bg-white/10"></div>
                    <span class="font-label-caps text-outline-variant">OR EMAIL</span>
                    <div class="h-[1px] flex-grow bg-white/10"></div>
                </div>
                <!-- Form -->
                <form class="space-y-stack-md" onsubmit="event.preventDefault()">
                    <div class="space-y-2">
                        <label class="font-label-caps text-on-surface-variant block ml-1" for="email">Email
                            Address</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">mail</span>
                            <input
                                class="w-full bg-surface-container-low border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline-variant focus:border-primary/50 transition-colors"
                                id="email" placeholder="name@example.com" type="email" />
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-center px-1">
                            <label class="font-label-caps text-on-surface-variant" for="password">Password</label>
                            <a class="font-body-sm text-secondary hover:text-primary transition-colors text-xs font-semibold"
                                href="#">Forgot password?</a>
                        </div>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">lock</span>
                            <input
                                class="w-full bg-surface-container-low border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline-variant focus:border-primary/50 transition-colors"
                                id="password" placeholder="••••••••" type="password" />
                        </div>
                    </div>
                    <div class="flex items-center gap-2 px-1">
                        <div class="relative flex items-center cursor-pointer">
                            <input
                                class="w-5 h-5 rounded-md border-white/10 bg-surface-container-low text-primary focus:ring-offset-background focus:ring-primary/20"
                                id="remember" type="checkbox" />
                            <label class="font-body-sm text-on-surface-variant ml-2 select-none cursor-pointer"
                                for="remember">Remember me for 30 days</label>
                        </div>
                    </div>
                    <button
                        class="w-full gradient-btn text-on-primary font-headline-md py-4 rounded-2xl flex items-center justify-center gap-2 group"
                        type="submit">
                        Sign In
                        <span
                            class="material-symbols-outlined transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
                    </button>
                </form>
                <footer class="mt-stack-lg text-center">
                    <p class="font-body-sm text-on-surface-variant">
                        Don't have an account?
                        <a class="text-primary font-bold hover:underline underline-offset-4 decoration-2"
                            href="signup.html">Create an account</a>
                    </p>
                </footer>
            </div>
        </div>
    </main>
    <!-- Branding Footer -->
    <footer class="w-full py-stack-lg mt-auto">
        <div
            class="flex flex-col md:flex-row justify-between items-center px-gutter max-w-container-max mx-auto gap-stack-md">
            <span class="font-display-lg text-body-lg font-bold text-primary">QuizFlow</span>
            <span class="font-body-sm text-body-sm text-on-surface-variant">© 2024 QuizFlow Intelligence. Elevate your
                potential.</span>
            <div class="flex gap-stack-md">
                <a class="text-on-surface-variant hover:text-tertiary transition-colors font-body-sm text-body-sm"
                    href="#">Privacy Policy</a>
                <a class="text-on-surface-variant hover:text-tertiary transition-colors font-body-sm text-body-sm"
                    href="#">Terms of Service</a>
            </div>
        </div>
    </footer>
</body>
</html>
